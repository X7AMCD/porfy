name: Website builder checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [x7-complete-element-management]

jobs:
  website-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run website builder regression checks
        run: node --test tests/website-builder.test.cjs
