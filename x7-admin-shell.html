<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X7 Studios Admin</title>
<style>
:root{--bg:#0d0d0e;--side:#111112;--card:#151516;--line:#252527;--text:#ececea;--mute:#8a8a8e;--dim:#5c5c60;--acc:#f2f2ee;--ok:#7fb08a;--warn:#d1a85c;--bad:#d77a72;--or:#e8734a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9eae5;--side:#f4f4f0;--card:#fbfbf8;--line:#dcdcd6;--text:#1a1a1b;--mute:#6b6b6f;--dim:#9a9a9e;--acc:#161617;color-scheme:light}}
:root[data-theme="light"]{--bg:#e9eae5;--side:#f4f4f0;--card:#fbfbf8;--line:#dcdcd6;--text:#1a1a1b;--mute:#6b6b6f;--dim:#9a9a9e;--acc:#161617;color-scheme:light}
:root[data-theme="dark"]{--bg:#0d0d0e;--side:#111112;--card:#151516;--line:#252527;--text:#ececea;--mute:#8a8a8e;--dim:#5c5c60;--acc:#f2f2ee}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 "Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--mute);outline-offset:2px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit;font-size:12.5px;width:100%}
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 18px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--acc);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:12px}
.brand b{display:block;font-size:13.5px}.brand span{font-size:11px;color:var(--mute)}
nav{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:0 8px 8px 0;color:var(--mute);text-align:left;width:100%}
.nav:hover{background:color-mix(in srgb,var(--text) 6%,transparent);color:var(--text)}
.nav.on{background:color-mix(in srgb,var(--text) 10%,transparent);color:var(--text);box-shadow:inset 2px 0 var(--acc)}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav .n{margin-left:auto;font-size:10.5px;color:var(--dim);border:1px solid var(--line);padding:0 6px;border-radius:99px}
.sp{flex:1;min-height:16px}.sep{height:1px;background:var(--line);margin:8px 4px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line);margin-top:8px}
.av{width:28px;height:28px;border-radius:50%;background:#34343a;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#ddd;flex:none}
small,.mute{color:var(--mute);font-size:11.5px}
main{overflow-y:auto;min-width:0;position:relative}
.top{display:flex;align-items:center;gap:10px;padding:10px 28px;border-bottom:1px solid var(--line);background:var(--side);position:sticky;top:0;z-index:5}
.menu{display:none;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:8px}
.cmd{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:8px;padding:7px 10px;min-width:220px;max-width:340px;flex:1}
.cmd kbd{margin-left:auto;font:10.5px inherit;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.top .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.ib{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;position:relative}
.ib i{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--or)}
.wrap{padding:24px 28px 44px;max-width:1280px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:25px;font-weight:500;letter-spacing:-.02em}.head p{color:var(--mute);margin-top:4px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;font-size:12px;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.p{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
.btn.or{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}
.btn.s{padding:3px 9px;font-size:11px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:6px 11px;font-size:11.5px;color:var(--mute)}.seg button.on{background:color-mix(in srgb,var(--text) 10%,transparent);color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card>h2,.ch h2{font-size:13.5px;font-weight:500}.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.stat strong{display:block;font-size:26px;font-weight:500;margin:6px 0 4px;letter-spacing:-.02em}
.up{color:var(--ok)}.dn{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .t{margin-left:auto;color:var(--mute);font-size:11px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.tag{padding:2px 8px;border-radius:99px;font-size:10.5px;border:1px solid var(--line);white-space:nowrap}
.tag.ok{color:var(--ok)}.tag.w{color:var(--warn)}.tag.b{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--acc)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--mute);font-weight:400;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--text) 4%,transparent)}
td{padding:11px 10px;border-bottom:1px solid var(--line)}tr.k{cursor:pointer}tr.k:hover td{background:color-mix(in srgb,var(--text) 4%,transparent)}
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--side);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:260px}
.col.over{border-color:var(--or)}.col h3{font-size:12px;font-weight:500;display:flex;justify-content:space-between;padding:2px 4px 10px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:grab}
.kc:hover{border-color:var(--dim)}.kc b{font-weight:500;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;color:var(--dim);font-size:11px;padding:4px}
.day{aspect-ratio:1.25;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:left;font-size:11.5px;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg)}
.day.bk{background:color-mix(in srgb,var(--ok) 16%,var(--bg))}.day.bl{background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 5px,var(--line) 5px,var(--line) 6px);color:var(--dim)}
.day.td{border-color:var(--acc)}.day.z{visibility:hidden}.day small{font-size:10px}
.tog{width:32px;height:18px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--text);transition:transform .15s}
.tog.on{background:var(--ok)}.tog.on::after{transform:translateX(14px);background:#fff}
.thumb{aspect-ratio:4/3;border-radius:10px;margin-bottom:10px;position:relative;overflow:hidden}
.thumb .tg{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:1px 8px;font-size:10.5px}
.drop{border:1px dashed var(--dim);border-radius:12px;padding:26px;text-align:center;color:var(--mute);margin-bottom:14px;background:var(--card)}
.drop.over{border-color:var(--or);color:var(--text)}
.fld{display:flex;flex-direction:column;gap:5px;color:var(--mute);font-size:11.5px;margin-bottom:10px}
.pw{font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em}
.tl{border-left:1px solid var(--line);margin-left:5px;padding-left:14px}.tl div{position:relative;padding:0 0 14px}.tl div::before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--dim)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none}.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--side);border-left:1px solid var(--line);z-index:31;transform:translateX(100%);transition:transform .2s;overflow-y:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.drawer.on{transform:none}
.pal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(520px,92vw);background:var(--side);border:1px solid var(--line);border-radius:14px;z-index:41;display:none;padding:10px}
.pal.on{display:block}.pal button{display:flex;gap:10px;width:100%;padding:9px 10px;border-radius:8px;color:var(--mute);text-align:left}.pal button:hover,.pal button.f{background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--text)}
.pop{position:absolute;right:28px;top:52px;width:320px;max-width:92vw;background:var(--side);border:1px solid var(--line);border-radius:12px;padding:12px;z-index:20;display:none;box-shadow:0 12px 40px rgba(0,0,0,.35)}.pop.on{display:block}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--acc);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:12px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
.bld{display:grid;grid-template-columns:240px 1fr 260px;gap:14px;min-height:560px}
.bld .pn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.cv{background:var(--side);border:1px solid var(--line);border-radius:12px;padding:20px;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px;overflow:auto}
.fr{margin:0 auto;width:100%;max-width:100%;transition:width .2s}
.site{background:#f4f4fb;color:#14142b;border-radius:10px;padding:12px 16px;min-height:480px;border:1px solid #d9dae8}
.blk{background:#fff;border:1px solid #e1e1ee;border-radius:8px;padding:20px;margin:10px 0;text-align:center;cursor:pointer;position:relative}
.blk:hover{border-color:#e8734a99}.blk.sel{border:1px dashed #e8734a;box-shadow:0 0 0 4px #e8734a1f}
.blk.sel::before{content:attr(data-n);position:absolute;top:-1px;right:-1px;background:#e8734a;color:#fff;font-size:10px;padding:3px 10px;border-radius:0 6px 0 6px}
.blk h3{font-size:19px;letter-spacing:-.02em}.blk p{color:#5d5d75;font-size:12.5px;margin-top:6px}
.blk .sb{display:inline-block;background:#14142b;color:#fff;border-radius:99px;padding:8px 18px;font-size:12px;margin-top:12px}
.blk .m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.blk .m div{background:#f4f4fb;border-radius:8px;padding:12px 6px;font-size:12px}
.pill{display:block;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;color:var(--mute)}.pill:hover{color:var(--or);border-color:var(--or)}
.page{animation:none}
@media (max-width:1000px){.g4,.g3{grid-template-columns:repeat(2,1fr)}.g21,.g2{grid-template-columns:1fr}.bld{grid-template-columns:1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:fixed;z-index:25;inset:0 auto 0 0;width:240px;transform:translateX(-100%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}body.open aside{transform:none}.menu{display:grid}.top{padding:10px 14px}.wrap{padding:18px 14px 34px}.g4,.g3{grid-template-columns:1fr}.cmd{min-width:0}.cmd span,.cmd kbd{display:none}.cmd{flex:0;padding:7px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
